[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: let React Router handle every path that isn't a real file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Content files change only when the site is redeployed, so browsers may
# cache them briefly; the hashed JS/CSS bundles are cached for a year.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
