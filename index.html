<!doctype html>
<html lang="hy">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Փոթորիկ · Potoreek</title>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Netlify Forms: hidden copies of the site's forms so Netlify detects
         them at deploy time. Field names must match src/lib/forms.js callers. -->
    <form name="preorder" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="email" /><input name="product_title" /><input name="bot-field" />
    </form>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="email" /><input name="bot-field" />
    </form>
  </body>
